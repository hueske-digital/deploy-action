# .github/workflows/deploy.yml of a site's repository. On every pushed tag
# v* (git tag v1.2.0 && git push origin v1.2.0):
#   build   the image for amd64 and arm64 in parallel, each on its own runner,
#           pushed by digest only
#   merge   both digests into one image, ghcr.io/<owner>/<repository>:latest
#           and :<tag>
#   deploy  asks the host to pull :latest
# The stack's entry names the image with :latest and has deploy: true.
# Settings of the repository: the variable DEPLOY_HOST (the wan name of the
# stack's host) and the secret DEPLOY_SECRET (<stack>_deploy_secret).
name: deploy

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

# One deploy at a time; a newer push waits for the one before.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, arch: amd64, runner: ubuntu-26.04 }
          - { platform: linux/arm64, arch: arm64, runner: ubuntu-26.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      # An image name is lower case; the repository's name may not be.
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Without a checkout: build-push-action builds the tagged commit.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      # Jobs share no files: each digest goes to merge as an artifact.
      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir digests && touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The tag's name is a valid image tag as long as it holds only
      # letters, digits, . _ and -.
      - working-directory: digests
        run: |
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create -t "$IMAGE:latest" -t "$IMAGE:$GITHUB_REF_NAME" "${sources[@]}"

  deploy:
    needs: merge
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: hueske-digital/deploy-action@c0df4f6bc8ebfea555932f385a164b1ca227bfd7 # v1.1.0
        with:
          host: ${{ vars.DEPLOY_HOST }}
          stack: kunde
          secret: ${{ secrets.DEPLOY_SECRET }}
